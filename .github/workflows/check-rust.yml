name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-23
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
      # `document.formats` defaults to `markdown` only, so the `docx`, `pdf`
      # and `epub` export paths were never compiled by the steps above even
      # though the capability table publishes them as `Partial`.
      - name: Feature matrix (docx, pdf, epub, html)
        run: cargo test -p document-formats --all-features --release
