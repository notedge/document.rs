name: Rust

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-23
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release

  # `document.formats` defaults to the `markdown` feature, so the default
  # build never compiles the `docx`, `pdf` or `epub` exporters even though the
  # capability table publishes them as `Partial`. This job runs on its own so
  # a failure earlier in `build` cannot skip the only step that compiles them.
  formats-features:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-23
      - name: Feature matrix (docx, pdf, epub, html)
        run: cargo test -p document-formats --all-features --release
