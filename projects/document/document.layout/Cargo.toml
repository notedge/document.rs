[package]
name = "document-layout"
version.workspace = true
authors.workspace = true
description = "Page, block, line, table, and pagination layout"
license.workspace = true
edition.workspace = true
readme = "readme.md"

[dependencies]
serde = { workspace = true, features = ["derive"] }
document-ir = { workspace = true }
document-formats = { workspace = true, features = ["tex"] }
plotter-scene = { workspace = true }
document-compose = { workspace = true, features = ["serde"] }
document-text = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
document-renderer-svg = { workspace = true }
