[package]
name = "template-framework-doki"
version.workspace = true
authors.workspace = true
description = "Doki 构建框架：登记为 template.framework.doki"
repository = "https://github.com/notedge/document.rs"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
template = { workspace = true }
template-framework = { workspace = true }
template-input-dejavu = { workspace = true }
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
miette = { version = "7", features = ["fancy"] }
notedown-formats = { git = "https://github.com/notedge/notedown.git", rev = "3c01bea86d5824771ff12e26dd50494f0199c0e7", default-features = false, features = ["markdown"] }
notedown-ir = { git = "https://github.com/notedge/notedown.git", rev = "3c01bea86d5824771ff12e26dd50494f0199c0e7" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
